# run_clean（DUFOMap 式动态点剔除）的参数，按 i2Nav-Robot 调好。扁平键；省略的键取程序里的缺省值（括号里）。
# i2Nav-Robot：传感器是 ADIS16465，离地 0.852 m（calibration.yaml 的 odo_lever）；重力对齐的世界系 z 朝上。

# 射线：一条从传感器到命中点的射线证明它穿过的体素此刻是空的
voxel: 0.4           # [m] 体素边长（0.2）；内存随它的立方反比增长
margin: 0.8          # [m] 射线最后这一段不算空：表面厚度、位姿误差（0.4）
max_range: 80.0      # [m] 不沿超过它的射线投射（80）

# 判定：被看空的扫描数 >= min_free 且 >= ratio * 其他命中它的扫描数，体素里的点就是动态的
min_free: 2          # （3）
ratio: 3.0           # （1.0）

# 地面：离本扫描地面平面 ground_dist 以内的点是地面，永远保留；0 关闭
ground_dist: 0.1     # [m]（0.3）
up_z: 1.0            # 世界系 z 轴朝上 +1，朝下 -1（1）
sensor_height: 0.852 # [m] 传感器离地高度（1.0）

# 近处一闪而过的东西：near_range 以内的点，其体素被命中的扫描数必须多于 min_hits；0 关闭
# min_hits 按扫描计：0.4 s 一帧时的 6 帧，等于局部 BA 0.1 s 一帧时的 24 帧
min_hits: 24         # （0）
near_range: 8.0      # [m]（8）

# 输出
min_range: 2.0       # [m] 比它更近的点不写出，载体自身（2.0）
