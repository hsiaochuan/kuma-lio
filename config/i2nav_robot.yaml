common:
#  lid_topic: "/hesai/at128/points"
  lid_topic: "/livox/mid360/points"
  imu_topic: "/adi/adis16465/imu"
  gnss_topic: ""
  img_topic: "/avt_camera/left/image/compressed"
  gnss_enable: false
  acc_ratio: false
  lidar_time_offset: 0
  image_time_offset: 0

front_end: fastlio
num_threads: 8
lidar_type: LIVOX
# Livox points are dropped when any bit of this mask is set in their tag: 63 keeps only tag 0 (the Mid360's good returns)
livox_tag_mask: 63
blind: 2.0
point_filter_num: 1
det_range: 50.0
# HESAI lidar
#extrin_t_il: [0.042, -0.018, -0.063]
#extrin_R_il: [0.99993817, -0.00770257, -0.00802099,
#              -0.0077132, -0.99996941, -0.00129509,
#              -0.00801077, 0.00135687, -0.99996699]
# MID360 lidar
extrin_t_il: [0.0, 0.0, -0.159]
extrin_R_il: [0.99997669, 0.00548118, -0.00407184,
              0.00549873, -0.99997558, 0.00431282,
              -0.0040481, -0.00433511, -0.99998241]
pcd_save_en: true
pcd_save_interval: 0.0
bag_save_en: false
image_save_en: true
image_save_interval: 1.5
resple:
  knot_hz: 100
  ds_scan_voxel: 0.1
  w_pt: 0.01
  nn_thresh: 0.5
  coeff_cov: 2.0
  plane_thresh: 0.1
  # Off.  Bumps reach 17 m/s^2; the default 10 drops those rows, and in the AT128's 48 ms without points
  # nothing is left to hold the spline's even/odd knot zig-zag, which then grows to meters.
  imu_acc_outlier: 1000000.0
  imu_gyro_outlier: 5.0
  # Stiff: each 10 ms window sees a 24 deg fan, so a 0.1 deg tilt error moves z by 2 cm from one fan to the next.
  # A loose spline follows that and z saws at the frame rate; a cart does not move like that.
  q_std_pos_old: 0.00316228
  q_std_ort_old: 0.01
  q_std_pos_new: 0.01
  q_std_ort_new: 0.03
  q_std_bg: 1.0e-3
  q_std_ba: 1.0e-2
  cov_P0: 0.02
  cov_acc: [1.0, 1.0, 1.0]
  cov_gyro: [0.0001, 0.0001, 0.0001]
  cov_bg: [0.000001, 0.000001, 0.000001]
  cov_ba: [0.2, 0.2, 0.2]
  cov_en: true
  r_base: 0.01  # the points of one fan share their error, they are not independent
  fb_std_pos: 0.003
  fb_std_ort: 0.0006
  fb_std_bg: 1.0e-3
  fb_std_ba: 1.0e-2
  fb_keep_cov: true

fastlio:
  mode: LIVO
  # FR-LIO sub-frames: a frame is cut into at most sub_max slices, each updated on its own, then smoothed; 1 = one update per frame
  sub_max: 4
  # IMU std within a frame at which sub_max slices are used (accel [m/s^2], gyro [rad/s]); both <= 0: always sub_max
  sub_std_acc: 0.0
  sub_std_gyr: 0.0
  down_size: 0.2
  cov_gyr: 0.01
  cov_acc: 1.0
  rdw_gyr: 1.0e-4
  rdw_acc: 1.0e-4
  r_base: 0.0005

lba:
  win_size: 10
  voxel_size: 1.0
  plane_eigen_ratio: 0.1
  min_plane_size: 0.1
  clutter_points: 30
  min_points: 5
  max_fix_points: 20
  max_iter: 3
  # ADIS16465: gyro integration alone holds attitude to 0.9 deg over 25 s, so BA must not outvote it.
  # With the defaults (2.5e-5, 1e-4) BA drove the gyro bias to 0.23 rad/s and fed that to the front end.
  imu_coef: 0.001
  cov_gyr: 0.0001
  cov_acc: 1.0
  rdw_gyr: 0.00000001
  rdw_acc: 1.0e-4
  sigma_num: 3
  pose_var: 1.0e-4
  range_err: 0.02
  angle_err: 0.05
  frame_dt: 0.1
  map_range: 200.0

gnss:
  lever_arm: [0.0, 0.0, 0.0]
  ali_min_travel: 50.0
  max_gap: 0.1
  tdcp_enable: true
  tdcp_std: 0.02
  tdcp_outlier: 0.5
  tdcp_chi2: 10.83
  tdcp_min_sat: 5
  tdcp_init_weight: 1.0
  tdcp_init_min_horiz: 0.05
  tdcp_init_max_std: 0.5
  std_clk: 10.0
  std_isb: 0.01
  std_clk_init: 10.0
  std_ext_yaw_init: 0.2
  std_ext_pos_init: 5.0
