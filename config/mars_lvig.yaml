common:
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  gnss_topic: "/ublox_driver/receiver_lla"
  gnss_enable: true
  acc_ratio: true
  lidar_time_offset: 0

lidar_type: LIVOX
blind: 1.0
point_filter_num: 1
det_range: 450.0

extrin_t_il: [0.04165, 0.02326, -0.0284]
extrin_R_il: [1, 0, 0,
              0, 1, 0,
              0, 0, 1]

ds_scan_voxel: 0.5
knot_hz: 100
w_pt: 0.01
nn_thresh: 0.5
coeff_cov: 2.0
q_std_pos_old: 0.0316228
q_std_ort_old: 0.0316228
q_std_pos_new: 0.1
q_std_ort_new: 0.1
cov_acc: [1.0, 1.0, 1.0]
cov_gyro: [0.001, 0.001, 0.001]
cov_bg: [1.0e-6, 1.0e-6, 1.0e-6]
cov_ba: [0.2, 0.2, 0.2]

pcd_save_en: false
pcd_save_interval: 30
bag_save_en: false

lba:
  win_size: 10
  voxel_size: 1.0
  plane_eigen_ratio: 0.1      # 平面判据 lambda_0/lambda_1 的上限，无量纲
  min_plane_size: 0.1        # 平面面内较小方向的最小标准差，按本层格子边长的比例给（铺满约 0.289）
  clutter_points: 30         # 一个 cell 点数超过此值且不属于任何平面就清空其中的点，0 为关闭
  min_points: 5
  max_fix_points: 20
  max_iter: 3
  imu_coef: 0.000025
  cov_gyr: 0.0001
  cov_acc: 1.0
  sigma_num: 3
  range_err: 0.02
  angle_err: 0.15
  cov_en: true
  fb_std_pos: 0.01
  fb_std_ort: 0.002
  fb_keep_cov: true
  frame_dt: 0.1
  map_range: 1000.0

gnss:
  tdcp_enable: true
  lever_arm: [0.0, 0.0, 0.0]
  ali_min_travel: 50.0
  max_gap: 1.0
  tdcp_std: 0.1
  tdcp_outlier: 0.5
  tdcp_chi2: 10.83
  tdcp_min_sat: 5
  tdcp_init_weight: 1.0
  tdcp_init_min_horiz: 0.05
  tdcp_init_max_std: 0.5
  std_clk: 10.0
  std_isb: 0.01

