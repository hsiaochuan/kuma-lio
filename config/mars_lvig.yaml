common:
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  gnss_topic: "/ublox_driver/receiver_lla"
  gnss_enable: true
  acc_ratio: true
  lidar_time_offset: 0

lidar_type: LIVOX
blind: 1.0
point_filter_num: 1
det_range: 450.0

extrin_t_il: [0.04165, 0.02326, -0.0284]
extrin_R_il: [1, 0, 0,
              0, 1, 0,
              0, 0, 1]

ds_scan_voxel: 0.5
knot_hz: 100
w_pt: 0.01
nn_thresh: 0.5
coeff_cov: 2.0
std_sys_pos: 0.1
std_sys_ort: 0.1
cov_acc: [1.0, 1.0, 1.0]
cov_gyro: [0.001, 0.001, 0.001]
cov_bg: [1.0e-6, 1.0e-6, 1.0e-6]

pcd_save_en: false
pcd_save_interval: 30
bag_save_en: false

lba:
  win_size: 10
  voxel_size: 1.0
  min_eigen_value: 0.0025
  min_points: 5
  max_fix_points: 20
  max_iter: 3
  imu_coef: 0.000025
  cov_gyr: 0.0001
  cov_acc: 1.0
  sigma_num: 3
  range_err: 0.02
  angle_err: 0.15
  cov_en: true
  fb_std_pos: 0.01
  fb_std_ort: 0.002
  fb_keep_cov: true
  frame_dt: 0.1
  map_range: 1000.0

pgo:
  enable: false
  kf_dis_th: 1.0
  kf_angle_th: 10.0
  kf_max_dt: 0.0
  kf_voxel_leaf: 0.4
  kf_max_range: 60.0
  kf_min_points: 300
  kf_max_staging_points: 500000
  loop_enable: true
  loop_search_radius: 25.0
  loop_search_max_dz: 4.0
  loop_min_kf_id: 50
  loop_closest_id_th: 50
  loop_kf_gap: 20
  loop_max_candidates: 3
  submap_half_size: 40
  submap_stride: 4
  loop_coarse_leaf: 0.8
  loop_fine_leaf: 0.3
  loop_coarse_max_corr: 5.0
  loop_fine_max_corr: 1.0
  loop_max_iterations: 40
  loop_fitness_th: 0.3
  loop_min_overlap: 0.5
  loop_max_corr_trans: 10.0
  loop_max_corr_rot: 30.0
  loop_min_odom_sigma_ratio: 1.0
  odom_sigma_trans: 0.10
  odom_sigma_rot: 3.0
  loop_sigma_trans: 0.20
  loop_sigma_rot: 3.0
  loop_robust_delta: 1.0
  final_lm_iterations: 50
  final_outlier_reject: true
  final_outlier_chi2: 22.46
  final_reject_rounds: 3
  final_sweep_max_loops: 200
  save_debug: true

gnss:
  tdcp_enable: true
  lever_arm: [0.0, 0.0, 0.0]
  ali_min_travel: 50.0
  max_gap: 1.0
  tdcp_std: 0.1
  tdcp_outlier: 0.5
  tdcp_chi2: 10.83
  tdcp_min_sat: 5
  tdcp_init_weight: 1.0
  tdcp_init_min_horiz: 0.05
  tdcp_init_max_std: 0.5
  std_clk: 10.0
  std_isb: 0.01
