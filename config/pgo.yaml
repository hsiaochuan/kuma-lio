# run_pgo 的参数，扁平键，全部可省略（缺省值即下面这些）。
# 同一个文件给 run_mapping_offline --pgo_config 时，回环按 Voxel-SLAM 紧耦合进 fastlio 前端：
# local BA 边缘化的 scan 构成位姿图，求解后修正窗口与 EKF 状态并重建局部地图。下面四个键只有耦合模式读：
map_kfs: 5               # 求解后局部地图由最新几个关键帧重建
reload_radius: 10.0      # [m] 之后距传感器这么近的历史关键帧逐帧载回局部地图
kf_voxel: 0.1            # [m] 为上面两项保存的关键帧点云体素
# 关键帧：Voxel-SLAM 每 win_size 个 scan 封一个
kf_scans: 10
kf_min_angle: 5.0        # [deg] 同时低于它和 kf_min_dist 才跳过
kf_min_dist: 0.1         # [m]
kf_ds_voxel: 0.2         # [m]
# 平面 cell：回环 ICP、BTC 的参考平面和平面重叠率都用它
plane_voxel: 1.0         # [m]
plane_min_points: 10
plane_min_eigen: 0.01    # [m^2]
# 候选分两层：先 BTC 描述子检索（旋转不变，种子来自三角形匹配），BTC 在该关键帧没有闭合回环时，
# 再用 radius 搜当前位姿附近的旧关键帧（种子来自里程计）。btc_enable: false 时只用 radius
btc_enable: true
loop_min_kf_gap: 30      # 关键帧数
loop_min_travel: 30.0    # [m] 两端之间的路程
# radius
loop_radius: 20.0        # [m]
loop_max_dz: 4.0         # [m]
loop_max_yaw_diff: 180.0  # [deg]
# BTC，缺省取 Voxel-SLAM 的 read_parameters（非高空）
btc_merge_normal: 0.1    # 平面 cell 合并：法向差
btc_merge_dist: 0.3      # [m] 合并：互相到平面的距离
btc_ref_planes: 2        # 参考平面个数 M
btc_pixel: 0.5           # [m] 高度编码图的像素
btc_layer_height: 0.1    # [m] 二值描述子一位
btc_height_min: 0.0      # [m] 参考平面之上的高度带（朝向传感器一侧），最多 64 层
btc_height_max: 5.0      # [m]
btc_min_bits: 10         # 关键点最小强度 sigma_I
btc_line_filter: true
btc_nms_radius: 2.0      # [m]
btc_max_keypoints: 100
btc_near_num: 15         # 组三角形的近邻数 K
btc_side_min: 2.0        # [m]
btc_side_max: 50.0       # [m]
btc_side_res: 0.2        # [m] 边长哈希量化
btc_side_tol: 0.01       # 边长差 < |side| * tol
btc_similarity: 0.7      # 三个顶点二值相似度均值 sigma_s
btc_candidates: 20       # 投票最高的候选关键帧数 kappa
btc_min_votes: 5
btc_ransac_dist: 3.0     # [m]
btc_min_inliers: 4
btc_overlap_normal: 0.2  # 平面重叠：法向差
btc_overlap_dist: 0.5    # [m] 平面重叠：点到面距离
btc_min_overlap: 0.5     # 平面重叠率阈值 sigma_p（Voxel-SLAM 的 jud_default）
# icp_normal
icp_max_iter: 20
icp_eigval: 3.0          # sum(n n^T) 的最小特征值，论文附录 B；实测 10 在走廊类重访过严
icp_min_match: 50
# 接受与触发
ratio_drift: 0.01        # 漂移 / 路程，论文：<= 1%
opt_cooldown_kf: 10      # 两次求解之间的关键帧冷却
opt_min_drift: 0.5       # [m] 低于此值只记录不求解；要高过平面 ICP 自身的噪声水平
# 噪声，按 gtsam::Pose3 的 [rot, trans] 给方差
loop_var: 1.0e-4
prior_var: 1.0e-9
odom_var_rot: 1.0e-6     # [rad^2] 相邻 scan 间相对位姿；TUM 里没有协方差，所以是常数
odom_var_trans: 1.0e-5   # [m^2]
