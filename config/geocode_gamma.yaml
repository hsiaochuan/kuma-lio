common:
  lid_topic: "/livox/lidar"
  imu_topic: "/imu/data"
  camera_topic: ""
  camera_enable: false
  visual_update: false
  imu_enable: true
  scan_interval: 0.1
  lidar_time_offset: 0
  camera_time_offset: 0
  image_skip: 1
preprocess:
  lidar_type: LIVOX
  blind: 4

mapping:
  acc_cov:       6.0e-2
  gyr_cov:       5.0e-3
  b_acc_cov:     8.0e-5
  b_gyr_cov:     3.0e-6
  det_range:     100.0
  extrin_t_il: [ 0.049258, -0.012500, 0.026946 ]
  extrin_R_il: [ 0.999620,  0.027463,  0.002445,
                 -0.027517,  0.999299,  0.025398,
                 -0.001746, -0.025456,  0.999674 ]

pcd_save_en: true
pcd_save_interval: 500
bag_save_en: false
image_save_en: false

point_filter_num: 1
max_iteration: 3
scan_filter_size: 0.2
map_filter_size: 0.2             # 暂时未用到，代码中为0， 即倾向于将降采样后的scan中的所有点加入map

ivox_grid_resolution: 0.2        # default=0.2
ivox_nearby_type: 18             # 6, 18, 26
esti_plane_threshold: 0.1        # default=0.1

global:
  lc_enable: false
  loop_weight: 1.0

  ba_enable: false
  ba_iters: 3

  keyframe_dist_threshold: 1.0
  keyframe_angle_threshold: 8.0
  keyframe_time_threshold: 3.0

  output_all_loop_reigster_result: false
  lc_detect_dist_thr: 5.0
  lc_detect_temporal_dist_thr: 30
  sub_map_interval: 5
