# FusionPortableV2 (HKUST-GZ), UGV sequences: Ouster OS1-128 + STIM300 (body_imu) + FLIR left frame camera.
# Calibration: github.com/fusionportable/calibration_files 20230426_calib (the UGV sequences'), the same values as
# the bags' /tf_static.
common:
  lid_topic: "/os_cloud_node/points"
  imu_topic: "/stim300/imu/data_raw"  # STIM300, 200 Hz, frame body_imu
  img_topic: "/stereo/frame_left/image_raw/compressed"  # frame_cam00, 20 Hz, 1024x768 jpg
  acc_ratio: false
  lidar_time_offset: -0.1
  image_time_offset: -0.013618216766727708

num_threads: 8
lidar_type: OUSTER
livox_tag_mask: 32
blind: 2.0
point_filter_num: 5
img_filter: 2  # keep one image in img_filter (1 = every image)
det_range: 150.0
extrin_t_il: [0.0359568, -0.01764044, 0.03291764]
extrin_R_il: [0.99995859, 0.00830747, 0.00371544,
              -0.00831236, 0.9999646, 0.00130257,
              -0.00370449, -0.0013334, 0.99999225]
pcd_save_en: true
pcd_save_interval: 0.0
bag_save_en: false
image_save_en: true
image_save_interval: 1.0
fastlio:
  mode: LIVO
  sub_max: 4
  sub_std_acc: 0.0
  sub_std_gyr: 0.0
  down_size: 0.1
  # STIM300, fusionportable/fastlio2 ouster128_fusionportable.yaml (gyr_cov, acc_cov, b_gyr_cov, b_acc_cov)
  cov_gyr: 5.6210762686976616e-03
  cov_acc: 0.23777720518818246
  rdw_gyr: 6.615657812411791e-05
  rdw_acc: 1.0885363217411185e-03
  r_base: 0.0005

lba:
  win_size: 10
  voxel_size: 1.0
  plane_eigen_ratio: 0.1
  min_plane_size: 0.1
  clutter_points: 20
  min_points: 5
  max_fix_points: 20
  max_iter: 3
  imu_coef: 0.0025
  cov_gyr: 0.0001
  cov_acc: 1.0
  rdw_gyr: 1.0e-6
  rdw_acc: 1.0e-4
  sigma_num: 3
  pose_var: 1.0e-4
  range_err: 0.02
  angle_err: 0.05
  frame_dt: 0.1
  map_range: 200.0

gnss:
  # no RINEX for FusionPortableV2: LIO only, the block is only parsed
  lever_arm: [0.0, 0.0, 0.0]
  ali_min_travel: 10.0
  ali_refine: true  # fastlio: yaw of the alignment re-estimated from the TDCP displacements
  max_gap: 0.1
  tdcp_dop_slip: 0.05  # [m] |phase change - integrated Doppler| above this is a cycle slip; Outdoor01: p99.9 0.036 m
  tdcp_enable: true
  tdcp_std: 0.02
  tdcp_outlier: 0.5
  tdcp_chi2: 10.83
  tdcp_min_sat: 5
  tdcp_init_weight: 1.0
  tdcp_init_min_horiz: 0.05
  tdcp_init_max_std: 0.5
  std_clk: 10.0
  std_isb: 0.01
  std_clk_init: 10.0
  std_ext_yaw_init: 0.2
  std_ext_pos_init: 5.0
