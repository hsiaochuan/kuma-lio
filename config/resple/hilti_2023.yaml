common:
  lid_topic: "/hesai/pandar"
  imu_topic: "/alphasense/imu"
  acc_ratio: false
  lidar_time_offset: 0

num_threads: 4
lidar_type: HESAI
# Livox points are dropped when any bit of this mask is set in their tag: 32 drops return numbers 2 and 3 only (FAST-LIO's rule); unused for other lidars
livox_tag_mask: 32
blind: 0.5
point_filter_num: 2
det_range: 100.0
extrin_t_il: [-0.00695046, -0.00671348, 0.04989346]
extrin_R_il: [0.00660964, -0.99997622, 0.00196524,
              -0.99997737, -0.00661209, -0.00124485,
              0.00125781, -0.00195697, -0.99999729]
bag_save_en: false
resple:
  knot_hz: 100
  ds_scan_voxel: 0.25
  w_pt: 0.01
  nn_thresh: 0.5
  coeff_cov: 2.0
  plane_thresh: 0.1  # max |point-to-plane| of the 5 neighbours when fitting [m]
  imu_acc_outlier: 10.0
  imu_gyro_outlier: 5.0
  q_std_pos_old: 0.0158114
  q_std_ort_old: 0.0158114
  q_std_pos_new: 0.05
  q_std_ort_new: 0.05
  q_std_bg: 1.0e-3
  q_std_ba: 1.0e-2
  cov_P0: 0.02
  cov_acc: [1.0, 1.0, 1.0]
  cov_gyro: [0.001, 0.001, 0.001]
  cov_bg: [0.000001, 0.000001, 0.000001]
  cov_ba: [0.2, 0.2, 0.2]
  # ikd-tree local map
  ds_lm_voxel: 0.25             # ikd-tree downsample leaf [m]
  cube_len: 2000.0         # local map cube edge length [m]
  nn_search_radius: 2.236  # Nearest_Search max distance [m]
