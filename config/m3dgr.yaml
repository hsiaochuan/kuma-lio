common:
  lid_topic: "/livox/avia/lidar"
  imu_topic: "/livox/avia/imu"
  gnss_topic: ""
  gnss_enable: false
  acc_ratio: false
  lidar_time_offset: 0

lidar_type: LIVOX
blind: 0.5
point_filter_num: 2
det_range: 450.0

# Livox Avia with its internal IMU (same extrinsic as the FAST-LIO2 / Voxel-SLAM baselines)
extrin_t_il: [0.04165, 0.02326, -0.0284]
extrin_R_il: [1, 0, 0,
              0, 1, 0,
              0, 0, 1]

ds_scan_voxel: 0.3
knot_hz: 100
w_pt: 0.01
nn_thresh: 0.5
coeff_cov: 3.0
std_sys_pos: 0.2
std_sys_ort: 0.1
cov_acc: [1.0, 1.0, 1.0]
cov_gyro: [0.1, 0.1, 0.1]
cov_bg: [0.2, 0.2, 0.2]

pcd_save_en: false
pcd_save_interval: 30
bag_save_en: false

lba:
  win_size: 10
  voxel_size: 0.5
  min_eigen_value: 0.001
  min_points: 5
  max_fix_points: 20
  max_iter: 3
  imu_coef: 0.000025
  cov_gyr: 0.0001
  cov_acc: 1.0
  sigma_num: 3
  range_err: 0.02
  angle_err: 0.05
  cov_en: false  # constant w_pt as in RESPLE; per-point variances gave more vertical drift with 0.5 m voxels
  fb_std_pos: 0.01
  fb_std_ort: 0.002
  fb_keep_cov: true
  frame_dt: 0.1

pgo:
  enable: false
