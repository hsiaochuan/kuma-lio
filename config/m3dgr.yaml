common:
  lid_topic: "/livox/avia/lidar"
  imu_topic: "/livox/avia/imu"
  gnss_topic: ""
  img_topic: ""
  gnss_enable: false
  acc_ratio: false
  lidar_time_offset: 0

front_end: resple
num_threads: 4
lidar_type: LIVOX
blind: 0.5
point_filter_num: 1
det_range: 450.0
# Livox Avia with its internal IMU (same extrinsic as the FAST-LIO2 / Voxel-SLAM baselines)
extrin_t_il: [0.04165, 0.02326, -0.0284]
extrin_R_il: [1, 0, 0,
              0, 1, 0,
              0, 0, 1]
pcd_save_en: false
bag_save_en: false
image_save_en: false
resple:
  knot_hz: 100
  ds_scan_voxel: 0.1
  w_pt: 0.01
  nn_thresh: 0.5
  coeff_cov: 3.0
  plane_thresh: 0.1
  imu_acc_outlier: 10.0
  imu_gyro_outlier: 5.0
  q_std_pos_old: 0.0632456
  q_std_ort_old: 0.0316228
  q_std_pos_new: 0.2
  q_std_ort_new: 0.1
  q_std_bg: 1.0e-3
  q_std_ba: 1.0e-2
  cov_P0: 0.02
  cov_acc: [1.0, 1.0, 1.0]
  cov_gyro: [0.001, 0.001, 0.001]
  cov_bg: [1.0e-6, 1.0e-6, 1.0e-6]
  cov_ba: [0.2, 0.2, 0.2]
  cov_en: false  # constant w_pt as in RESPLE; per-point variances gave more vertical drift with 0.5 m voxels
  r_base: 0.001
  fb_std_pos: 0.01
  fb_std_ort: 0.002
  fb_std_bg: 1.0e-3
  fb_std_ba: 1.0e-2
  fb_keep_cov: true

fastlio:
  mode: LIO
  down_size: 0.25
  cov_gyr: 0.01
  cov_acc: 1.0
  rdw_gyr: 1.0e-4
  rdw_acc: 1.0e-4
  r_base: 0.0005

lba:
  win_size: 10
  voxel_size: 1.0
  plane_eigen_ratio: 0.1
  min_plane_size: 0.1
  clutter_points: 20
  min_points: 5
  max_fix_points: 20
  max_iter: 3
  imu_coef: 0.000025
  cov_gyr: 0.0001
  cov_acc: 1.0
  rdw_gyr: 1.0e-4
  rdw_acc: 1.0e-4
  sigma_num: 3
  pose_var: 1.0e-4
  range_err: 0.02
  angle_err: 0.05
  frame_dt: 0.1
  map_range: 200.0

gnss:
  lever_arm: [0.0, 0.0, 0.0]
  ali_min_travel: 50.0
  max_gap: 0.1
  tdcp_enable: true
  tdcp_std: 0.02
  tdcp_outlier: 0.5
  tdcp_chi2: 10.83
  tdcp_min_sat: 5
  tdcp_init_weight: 1.0
  tdcp_init_min_horiz: 0.05
  tdcp_init_max_std: 0.5
  std_clk: 10.0
  std_isb: 0.01
  std_clk_init: 10.0
  std_ext_yaw_init: 0.2
  std_ext_pos_init: 5.0

cam:
  model: ""
  width: 0
  height: 0
  params: []
  extrin_R_cl: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  extrin_t_cl: [0.0, 0.0, 0.0]
