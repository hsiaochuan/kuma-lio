common:
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  camera_topic: ""
  camera_enable: false
  imu_enable: false
  scan_interval: 0.02
  lidar_time_offset: 0
  camera_time_offset: 0
  image_skip: 1
preprocess:
  lidar_type: LIVOX
  blind: 1

mapping:
  acc_cov:       2
  gyr_cov:       50
  b_acc_cov:     0.0001
  b_gyr_cov:     0.0001
  fov_degree:    360
  det_range:     100.0
  extrin_t_il: [0.04165, 0.02326, -0.0284]
  extrin_R_il: [1, 0, 0, 0, 1, 0, 0, 0, 1]

path_save_en: true                 # 保存轨迹，用于精度计算和比较

pcd_save:
  pcd_save_en: true
  interval: 500                 # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

image_save_en: true

point_filter_num: 1
max_iteration: 3
scan_filter_size: 0.1
map_filter_size: 0.1             # 暂时未用到，代码中为0， 即倾向于将降采样后的scan中的所有点加入map

ivox_grid_resolution: 0.1        # default=0.2
ivox_nearby_type: 18             # 6, 18, 26
esti_plane_threshold: 0.1        # default=0.1

# Retail_Street, CBD_Building_01, Bright_Screen_Wall
cam:
  # pinhole
  # pinhole_radial
  # pinhole_fisheye
  # spherical
  camera_model: pinhole_radial
  distortion_param: [-0.076160, 0.123001, 0.0, -0.00113, 0.000251]
  pinhole_param: [1293.56944, 1293.3155, 626.91359, 522.799224]
  resolution: [1280, 1024]
  extrin_t_cl: [ 0.0194384, 0.104689,-0.0251952 ]
  extrin_R_cl: [ 0.00610193,-0.999863,-0.0154172,
                  -0.00615449,0.0153796,-0.999863,
                  0.999962,0.00619598,-0.0060598 ]

global:
  lc_enable: false
  loop_weight: 1.0

  ba_enable: false
  ba_iters: 3

  keyframe_dist_threshold: 1.0
  keyframe_angle_threshold: 8.0
  keyframe_time_threshold: 3.0

  output_all_loop_reigster_result: false
  lc_detect_dist_thr: 5.0
  lc_detect_temporal_dist_thr: 30
  sub_map_interval: 5