common:
  lid_topic: "/hesai/pandar"
  imu_topic: "/alphasense/imu"
  camera_topic: "/alphasense/cam0/image_raw"
  gnss_topic: ""
  camera_enable: false
  gnss_enable: false
  acc_ratio: false
  lidar_time_offset: 0
  camera_time_offset: 0
  image_skip: 1

lidar_type: HESAI
blind: 0.5
point_filter_num: 2
det_range:     100.0

extrin_t_il: [ -0.001, -0.00855, 0.055 ]
extrin_R_il: [ 0.7071068, -0.7071068, 0, 0 ]

ds_scan_voxel: 0.25
ds_lm_voxel: 0.25
knot_hz:      100               # control points per second of the B-spline trajectory
w_pt:         0.01              # per-point measurement variance of the LiDAR residual
plane_thresh: 0.05              # max |point-to-plane| of the 5 neighbours when fitting [m]
nn_thresh:    0.5               # point-to-plane residual gate [m]
coeff_cov:    2.0               # accept a point when lid_cov < w_pt * coeff_cov
std_sys_pos:  0.05              # spline process noise, position
std_sys_ort:  0.05              # spline process noise, orientation
cov_acc:      [1.0, 1.0, 1.0]   # accelerometer measurement variance
cov_gyro:     [0.1, 0.1, 0.1]   # gyroscope measurement variance

pcd_save_en: true
pcd_save_interval: 30
bag_save_en: false
image_save_en: false