common:
  lid_topic: "/os1_cloud_node1/points"
  imu_topic: "/imu/imu"
  camera_topic: "/left/image_raw"
  camera_enable: false
  imu_enable: true
  scan_interval: 0.1
  lidar_time_offset: 0
  camera_time_offset: 0
  image_skip: 1
preprocess:
  lidar_type: OUSTER
  blind: 1

mapping:
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  det_range:     100.0
  extrin_t_il: [-0.050, 0.000, 0.055]
  extrin_R_il: [1, 0, 0, 0, 1, 0, 0, 0, 1]

pcd_save:
  pcd_save_en: true
  interval: 500

image_save_en: false

point_filter_num: 1
max_iteration: 3
scan_filter_size: 0.2
map_filter_size: 0.2             # 暂时未用到，代码中为0， 即倾向于将降采样后的scan中的所有点加入map

ivox_grid_resolution: 0.2        # default=0.2
ivox_nearby_type: 18             # 6, 18, 26
esti_plane_threshold: 0.1        # default=0.1

global:
  lc_enable: false
  loop_weight: 1.0

  ba_enable: false
  ba_iters: 3

  keyframe_dist_threshold: 1.0
  keyframe_angle_threshold: 8.0
  keyframe_time_threshold: 3.0

  output_all_loop_reigster_result: false
  lc_detect_dist_thr: 5.0
  lc_detect_temporal_dist_thr: 30
  sub_map_interval: 5
