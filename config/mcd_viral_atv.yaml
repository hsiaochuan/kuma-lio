common:
  lid_topic: "/livox/lidar"
  imu_topic: "/vn100/imu"
  gnss_topic: ""
  gnss_enable: false
  acc_ratio: false
  lidar_time_offset: 0

lidar_type: LIVOX
blind: 1.0
point_filter_num: 1
det_range: 100.0

extrin_t_il: [-0.010514839241742317, -0.008989784841758377, 0.037356468638334630]
extrin_R_il: [0.99985813160508060000, -0.0002258196228773494, -0.0168423771687589430,
              -0.00017111407692153792, -0.9999947058517530000, 0.0032494597148797887,
              -0.01684302179448474500, -0.0032461167514232880, -0.9998528768488223000]

ds_scan_voxel: 0.5
knot_hz: 100
w_pt: 0.02
nn_thresh: 0.5
coeff_cov: 2.0
q_std_pos_old: 0.0316228
q_std_ort_old: 0.0316228
q_std_pos_new: 0.1
q_std_ort_new: 0.1
cov_acc: [1.0, 1.0, 1.0]
cov_gyro: [0.1, 0.1, 0.1]
cov_bg: [0.2, 0.2, 0.2]
cov_ba: [0.2, 0.2, 0.2]

pcd_save_en: true
pcd_save_interval: 30
bag_save_en: false

lba:
  win_size: 10
  voxel_size: 1.0
  plane_eigen_ratio: 0.1      # 平面判据 lambda_0/lambda_1 的上限，无量纲
  min_plane_size: 0.1        # 平面面内较小方向的最小标准差，按本层格子边长的比例给（铺满约 0.289）
  clutter_points: 30         # 一个 cell 点数超过此值且不属于任何平面就清空其中的点，0 为关闭
  min_points: 5
  max_fix_points: 20
  max_iter: 3
  imu_coef: 0.0001
  cov_gyr: 0.0001
  cov_acc: 1.0
  sigma_num: 3
  range_err: 0.02
  angle_err: 0.05
  cov_en: true
  fb_std_pos: 0.001
  fb_std_ort: 0.0002
  fb_keep_cov: true
  frame_dt: 0.1

