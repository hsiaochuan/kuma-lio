common:
  lid_topic: "/livox/lidar"
  imu_topic: "/vn100/imu"
  gnss_topic: ""
  img_topic: ""
  gnss_enable: false
  acc_ratio: false
  lidar_time_offset: 0

front_end: resple
num_threads: 4
lidar_type: LIVOX
blind: 1.0
point_filter_num: 1
det_range: 100.0
extrin_t_il: [-0.010514839241742317, -0.008989784841758377, 0.037356468638334630]
extrin_R_il: [0.99985813160508060000, -0.0002258196228773494, -0.0168423771687589430,
              -0.00017111407692153792, -0.9999947058517530000, 0.0032494597148797887,
              -0.01684302179448474500, -0.0032461167514232880, -0.9998528768488223000]
pcd_save_en: true
bag_save_en: false
image_save_en: false
image_save_interval: 1.5
resple:
  knot_hz: 100
  ds_scan_voxel: 0.5
  w_pt: 0.02
  nn_thresh: 0.5
  coeff_cov: 2.0
  plane_thresh: 0.1
  imu_acc_outlier: 10.0
  imu_gyro_outlier: 5.0
  q_std_pos_old: 0.0316228
  q_std_ort_old: 0.0316228
  q_std_pos_new: 0.1
  q_std_ort_new: 0.1
  q_std_bg: 1.0e-3
  q_std_ba: 1.0e-2
  cov_P0: 0.02
  cov_acc: [1.0, 1.0, 1.0]
  cov_gyro: [0.1, 0.1, 0.1]
  cov_bg: [0.2, 0.2, 0.2]
  cov_ba: [0.2, 0.2, 0.2]
  cov_en: true
  r_base: 0.001
  fb_std_pos: 0.001
  fb_std_ort: 0.0002
  fb_std_bg: 1.0e-3
  fb_std_ba: 1.0e-2
  fb_keep_cov: true

fastlio:
  mode: LIO
  down_size: 0.25
  cov_gyr: 0.01
  cov_acc: 1.0
  rdw_gyr: 1.0e-4
  rdw_acc: 1.0e-4
  r_base: 0.0005

lba:
  win_size: 10
  voxel_size: 1.0
  plane_eigen_ratio: 0.1      # 平面判据 lambda_0/lambda_1 的上限，无量纲
  min_plane_size: 0.1        # 平面面内较小方向的最小标准差，按本层格子边长的比例给（铺满约 0.289）
  clutter_points: 30         # 一个 cell 点数超过此值且不属于任何平面就清空其中的点，0 为关闭
  min_points: 5
  max_fix_points: 20
  max_iter: 3
  imu_coef: 0.0001
  cov_gyr: 0.0001
  cov_acc: 1.0
  rdw_gyr: 1.0e-4
  rdw_acc: 1.0e-4
  sigma_num: 3
  pose_var: 1.0e-4
  range_err: 0.02
  angle_err: 0.05
  frame_dt: 0.1
  map_range: 200.0

gnss:
  lever_arm: [0.0, 0.0, 0.0]
  ali_min_travel: 50.0
  max_gap: 0.1
  tdcp_enable: true
  tdcp_std: 0.02
  tdcp_outlier: 0.5
  tdcp_chi2: 10.83
  tdcp_min_sat: 5
  tdcp_init_weight: 1.0
  tdcp_init_min_horiz: 0.05
  tdcp_init_max_std: 0.5
  std_clk: 10.0
  std_isb: 0.01
  std_clk_init: 10.0
  std_ext_yaw_init: 0.2
  std_ext_pos_init: 5.0

cam:
  model: ""
  width: 0
  height: 0
  params: []
  extrin_R_cl: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  extrin_t_cl: [0.0, 0.0, 0.0]
