common:
  lid_topic: "/livox/lidar"
  imu_topic: "/vn100/imu"
  camera_topic: ""
  camera_enable: false
  visual_update: false
  imu_enable: true
  acc_ratio: false
  lidar_time_offset: 0
  camera_time_offset: 0
  image_skip: 1

lidar_type: LIVOX
blind: 1.0
point_filter_num: 1
det_range:     100.0

extrin_t_il: [ -0.010514839241742317,   -0.008989784841758377,   0.037356468638334630 ]
extrin_R_il: [  0.99985813160508060000, -0.0002258196228773494, -0.0168423771687589430,
                -0.00017111407692153792, -0.9999947058517530000,  0.0032494597148797887,
                -0.01684302179448474500, -0.0032461167514232880, -0.9998528768488223000]

ds_scan_voxel: 0.5
ds_lm_voxel: 0.5

knot_hz:      100               # control points per second of the B-spline trajectory
w_pt:         0.02              # per-point measurement variance of the LiDAR residual
plane_thresh: 0.1               # max |point-to-plane| of the 5 neighbours when fitting [m]
nn_thresh:    0.5               # point-to-plane residual gate [m]
coeff_cov:    2.0               # accept a point when lid_cov < w_pt * coeff_cov
std_sys_pos:  0.1               # spline process noise, position
std_sys_ort:  0.1               # spline process noise, orientation
cov_acc:      [1.0, 1.0, 1.0]   # accelerometer measurement variance
cov_gyro:     [0.1, 0.1, 0.1]   # gyroscope measurement variance

pcd_save_en: true
pcd_save_interval: 30
bag_save_en: false
image_save_en: false